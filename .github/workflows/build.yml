name: Build PrimeGram

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Assemble Afat debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android: it shells out to
      # `sdkmanager tools`, and the `tools` package no longer exists in the
      # modern SDK repository, so the action dies before the build starts.
      # The runner already ships a full Android SDK, so we just point at it.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          echo "Using $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platform-tools"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -Pprimegram.abis=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeGram-afat-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
